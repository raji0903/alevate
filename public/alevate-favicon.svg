<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 40 40"
>
  <defs>

    <!-- Purple background -->
    <linearGradient
      id="purpleBackground"
      x1="0"
      y1="0"
      x2="40"
      y2="40"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Main A -->
    <linearGradient
      id="purpleA"
      x1="10"
      y1="30"
      x2="28"
      y2="5"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Rising bridge -->
    <linearGradient
      id="purpleBridge"
      x1="5"
      y1="25"
      x2="31"
      y2="8"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="55%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>

  </defs>


  <!-- =====================================================
       OUTER PURPLE LOGO
       ===================================================== -->

  <rect
    width="40"
    height="40"
    rx="12"
    fill="url(#purpleBackground)"
  />


  <!-- =====================================================
       DARK INNER AREA
       ===================================================== -->

  <rect
    x="3"
    y="3"
    width="34"
    height="34"
    rx="10"
    fill="#12051F"
  />


  <!-- =====================================================
       ALEVATE "A"
       ===================================================== -->

  <path
    d="
      M7 29
      L15.4 6.8
      C16.1 5
      17.5 4
      19.3 4.4
      C20.4 4.7
      21.2 5.6
      21.7 6.6
      L29 29
      H23.8
      L21.9 22.8
      H14.1
      L12.2 29
      H7Z
    "
    fill="url(#purpleA)"
  />


  <!-- =====================================================
       INNER A CUTOUT
       ===================================================== -->

  <path
    d="
      M18 10.8
      L15.6 18.2
      H20.4
      L18 10.8Z
    "
    fill="#1A0B2E"
  />


  <!-- =====================================================
       UPWARD MENTORSHIP BRIDGE
       ===================================================== -->

  <path
    d="
      M5 23.5
      C9.2 23.5
      13.8 20.8
      18.5 17.2
      C23.2 13.6
      27.5 10.2
      31 9.2
      C29.2 11.8
      25.5 15.5
      21.2 19
      C16.8 22.5
      11.5 25
      5 23.5Z
    "
    fill="url(#purpleBridge)"
  />


  <!-- =====================================================
       MENTORSHIP SPARKLE
       ===================================================== -->

  <path
    d="
      M29.5 4
      C29.5 6.2
      30.8 7.5
      33 7.5
      C30.8 7.5
      29.5 8.8
      29.5 11
      C29.5 8.8
      28.2 7.5
      26 7.5
      C28.2 7.5
      29.5 6.2
      29.5 4Z
    "
    fill="#E9D5FF"
  />

</svg>